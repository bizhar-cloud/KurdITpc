<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Disconnected</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
        }

        .bg-image {
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px; 
            background-image: url('https://i.postimg.cc/nrwBbmmk/IMG-0113.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(8px);
            z-index: -2;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.6); 
            z-index: -1;
        }

        .container {
            background: rgba(20, 20, 20, 0.6); 
            padding: 45px 35px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            max-width: 450px;
            border-top: 5px solid #e74c3c;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            color: #ffffff;
            z-index: 1; 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }

        h1 {
            color: #e74c3c;
            margin-bottom: 10px;
            font-size: 26px;
            letter-spacing: 1px;
        }

        p {
            line-height: 1.6;
            color: #dcdcdc;
            font-size: 16px;
            margin-bottom: 30px;
        }

        strong {
            color: #ffffff;
            font-weight: 600;
        }

        button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
        }

        button:hover {
            background-color: #c0392b;
            box-shadow: 0 6px 20px rgba(192, 57, 43, 0.5);
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }

        #statusResult {
            margin-top: 20px;
            font-size: 14px;
            font-weight: 600;
            height: 20px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    
    <div class="bg-image"></div>
    <div class="overlay"></div>

    <div class="container">
        <div class="icon">⚠️</div>
        <h1>Server Disconnected</h1>
        <p id="message">
            <strong>Sorry!</strong> The server is currently disconnected and not working.<br>Please try again later.
        </p>
        <button id="checkStatusBtn">Try Again</button>
        <p id="statusResult"></p>
    </div>
    
    <script>
        document.getElementById('checkStatusBtn').addEventListener('click', function() {
            const statusResult = document.getElementById('statusResult');
            const button = document.getElementById('checkStatusBtn');
            
            button.disabled = true;
            button.style.opacity = "0.7";
            button.innerText = "Checking...";
            
            statusResult.innerText = "Checking server connection...";
            statusResult.style.color = "#f39c12"; 

            setTimeout(function() {
                statusResult.innerText = "Connection failed. Server is still offline.";
                statusResult.style.color = "#e74c3c"; 
                
                button.disabled = false;
                button.style.opacity = "1";
                button.innerText = "Try Again";
            }, 2000);
        });
    </script>
</body>
</html>
