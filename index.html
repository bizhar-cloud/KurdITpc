<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Unavailable</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
        }

        .bg-image {
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px; 
            background-image: url('https://i.postimg.cc/nrwBbmmk/IMG-0113.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(8px); /* بلور ل ڤێرێ هاتە کێمکرن بۆ 8px */
            z-index: -2;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        .container {
            background-color: rgba(0, 0, 0, 0.5); 
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            border-top: 5px solid #e74c3c;
            color: #ffffff;
            z-index: 1; 
            backdrop-filter: blur(4px); /* ئەڤە هندەک بلور ددەتە بۆکسێ نڤیسینێ بخۆ دا جانتر لێ بهێت */
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }

        h1 {
            color: #e74c3c;
            margin-bottom: 15px;
            font-size: 28px;
        }

        p {
            line-height: 1.6;
            color: #cccccc;
            font-size: 16px;
            margin-bottom: 25px;
        }

        strong {
            color: #ffffff;
        }

        button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #c0392b;
        }

        #statusResult {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            height: 20px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    
    <div class="bg-image"></div>
    <div class="overlay"></div>

    <div class="container">
        <div class="icon">⚠️</div>
        <h1>Service Unavailable</h1>
        <p id="message">
            <strong>sorry!</strong> The server is currently not working.<br><br>
            The service is currently offline. Please complete the payment of the <strong>3.99$</strong> monthly subscription fee to renew your account and reactivate the server.
        </p>
        <button id="checkStatusBtn">Check Server Status</button>
        <p id="statusResult"></p>
    </div>
    
    <script>
        document.getElementById('checkStatusBtn').addEventListener('click', function() {
            const statusResult = document.getElementById('statusResult');
            const button = document.getElementById('checkStatusBtn');
            
            button.disabled = true;
            button.style.opacity = "0.5";
            
            statusResult.innerText = "Checking server connection...";
            statusResult.style.color = "#f1c40f"; 

            setTimeout(function() {
                statusResult.innerText = "Error: Server is still offline. Please try again later.";
                statusResult.style.color = "#e74c3c"; 
                
                button.disabled = false;
                button.style.opacity = "1";
            }, 2000);
        });
    </script>
</body>
</html>
